<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1120" viewBox="0 0 1060 1120" role="img" aria-labelledby="title"><title id="title">建议方案：额度预占、实际结算与会话关联</title><rect width="1060" height="1120" fill="#fbfcfe"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#172033"><text x="530" y="35" text-anchor="middle" font-size="21"><tspan x="530" dy="0">建议方案：额度预占、实际结算与会话关联</tspan></text><line x1="140" y1="123" x2="140" y2="1025" stroke="#b7c3d6" stroke-dasharray="6 5"/><rect x="30" y="70" width="220" height="53" rx="9" fill="#edf2ff" stroke="#9baedc"/><text x="140" y="102" text-anchor="middle" font-size="17"><tspan x="140" dy="0">Agent Loop</tspan></text><line x1="400" y1="123" x2="400" y2="1025" stroke="#b7c3d6" stroke-dasharray="6 5"/><rect x="290" y="70" width="220" height="53" rx="9" fill="#edf2ff" stroke="#9baedc"/><text x="400" y="102" text-anchor="middle" font-size="17"><tspan x="400" dy="0">账号额度账本</tspan></text><line x1="660" y1="123" x2="660" y2="1025" stroke="#b7c3d6" stroke-dasharray="6 5"/><rect x="550" y="70" width="220" height="53" rx="9" fill="#edf2ff" stroke="#9baedc"/><text x="660" y="102" text-anchor="middle" font-size="17"><tspan x="660" dy="0">模型服务</tspan></text><line x1="920" y1="123" x2="920" y2="1025" stroke="#b7c3d6" stroke-dasharray="6 5"/><rect x="810" y="70" width="220" height="53" rx="9" fill="#edf2ff" stroke="#9baedc"/><text x="920" y="102" text-anchor="middle" font-size="17"><tspan x="920" dy="0">会话日志</tspan></text><polyline points="140,190 400,190" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="400,190 390,185 390,195" fill="#526bb0"/><text x="270" y="150" text-anchor="middle" font-size="15"><tspan x="270" dy="0">1. 以请求尝试身份预占 8 元</tspan></text><polyline points="400,278 485,278 485,302 400,302" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="400,302 410,307 410,297" fill="#526bb0"/><text x="480" y="240" text-anchor="middle" font-size="15"><tspan x="480" dy="0">2. 事务检查并记录预占 R1</tspan></text><polyline points="400,366 140,366" fill="none" stroke="#526bb0" stroke-width="2" stroke-dasharray="6 5"/><polygon points="140,366 150,371 150,361" fill="#526bb0"/><text x="270" y="326" text-anchor="middle" font-size="15"><tspan x="270" dy="0">3. 返回预占成功与编号 R1</tspan></text><polyline points="140,454 920,454" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="920,454 910,449 910,459" fill="#526bb0"/><text x="530" y="414" text-anchor="middle" font-size="15"><tspan x="530" dy="0">4. 持久记录请求与 R1 关联</tspan></text><polyline points="140,542 660,542" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="660,542 650,537 650,547" fill="#526bb0"/><text x="400" y="502" text-anchor="middle" font-size="15"><tspan x="400" dy="0">5. 发起受预算约束的模型调用</tspan></text><polyline points="660,630 140,630" fill="none" stroke="#526bb0" stroke-width="2" stroke-dasharray="6 5"/><polygon points="140,630 150,635 150,625" fill="#526bb0"/><text x="400" y="590" text-anchor="middle" font-size="15"><tspan x="400" dy="0">6. 返回响应与可核验用量</tspan></text><polyline points="140,718 400,718" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="400,718 390,713 390,723" fill="#526bb0"/><text x="270" y="678" text-anchor="middle" font-size="15"><tspan x="270" dy="0">7. 按 R1 提交实际费用 3 元</tspan></text><polyline points="400,806 485,806 485,830 400,830" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="400,830 410,835 410,825" fill="#526bb0"/><text x="480" y="768" text-anchor="middle" font-size="15"><tspan x="480" dy="0">8. 幂等结算并释放剩余 5 元</tspan></text><polyline points="400,894 140,894" fill="none" stroke="#526bb0" stroke-width="2" stroke-dasharray="6 5"/><polygon points="140,894 150,899 150,889" fill="#526bb0"/><text x="270" y="854" text-anchor="middle" font-size="15"><tspan x="270" dy="0">9. 返回结算回执</tspan></text><polyline points="140,982 920,982" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="920,982 910,977 910,987" fill="#526bb0"/><text x="530" y="942" text-anchor="middle" font-size="15"><tspan x="530" dy="0">10. 追加用量及结算关联事实</tspan></text><rect x="30" y="1046" width="1000" height="54" rx="9" fill="#fff6e5" stroke="#dcc394"/><text x="530" y="1078" text-anchor="middle" font-size="15"><tspan x="530" dy="0">此图为成功路径；请求结果未知时保留待对账状态，不直接释放全部预占。</tspan></text></g></svg>
