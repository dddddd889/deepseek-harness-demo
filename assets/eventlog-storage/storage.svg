<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1208" viewBox="0 0 1060 1208" role="img" aria-labelledby="title"><title id="title">建议方案：大产物、会话提交与历史归档</title><rect width="1060" height="1208" fill="#fbfcfe"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#172033"><text x="530" y="35" text-anchor="middle" font-size="21"><tspan x="530" dy="0">建议方案：大产物、会话提交与历史归档</tspan></text><line x1="140" y1="123" x2="140" y2="1113" stroke="#b7c3d6" stroke-dasharray="6 5"/><rect x="30" y="70" width="220" height="53" rx="9" fill="#edf2ff" stroke="#9baedc"/><text x="140" y="102" text-anchor="middle" font-size="17"><tspan x="140" dy="0">Agent / 工具执行器</tspan></text><line x1="400" y1="123" x2="400" y2="1113" stroke="#b7c3d6" stroke-dasharray="6 5"/><rect x="290" y="70" width="220" height="53" rx="9" fill="#edf2ff" stroke="#9baedc"/><text x="400" y="102" text-anchor="middle" font-size="17"><tspan x="400" dy="0">对象存储</tspan></text><line x1="660" y1="123" x2="660" y2="1113" stroke="#b7c3d6" stroke-dasharray="6 5"/><rect x="550" y="70" width="220" height="53" rx="9" fill="#edf2ff" stroke="#9baedc"/><text x="660" y="102" text-anchor="middle" font-size="17"><tspan x="660" dy="0">会话数据库</tspan></text><line x1="920" y1="123" x2="920" y2="1113" stroke="#b7c3d6" stroke-dasharray="6 5"/><rect x="810" y="70" width="220" height="53" rx="9" fill="#edf2ff" stroke="#9baedc"/><text x="920" y="102" text-anchor="middle" font-size="17"><tspan x="920" dy="0">归档任务</tspan></text><polyline points="140,190 400,190" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="400,190 390,185 390,195" fill="#526bb0"/><text x="270" y="150" text-anchor="middle" font-size="15"><tspan x="270" dy="0">1. 写入大产物与内容哈希</tspan></text><polyline points="400,278 140,278" fill="none" stroke="#526bb0" stroke-width="2" stroke-dasharray="6 5"/><polygon points="140,278 150,283 150,273" fill="#526bb0"/><text x="270" y="238" text-anchor="middle" font-size="15"><tspan x="270" dy="0">2. 确认对象已持久保存</tspan></text><polyline points="140,366 660,366" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="660,366 650,361 650,371" fill="#526bb0"/><text x="400" y="326" text-anchor="middle" font-size="15"><tspan x="400" dy="0">3. 提交事件、序号和产物引用</tspan></text><polyline points="660,454 140,454" fill="none" stroke="#526bb0" stroke-width="2" stroke-dasharray="6 5"/><polygon points="140,454 150,459 150,449" fill="#526bb0"/><text x="400" y="414" text-anchor="middle" font-size="15"><tspan x="400" dy="0">4. 确认达到约定耐久边界</tspan></text><polyline points="920,542 660,542" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="660,542 670,547 670,537" fill="#526bb0"/><text x="790" y="502" text-anchor="middle" font-size="15"><tspan x="790" dy="0">5. 读取可归档的已提交事件段</tspan></text><polyline points="660,630 920,630" fill="none" stroke="#526bb0" stroke-width="2" stroke-dasharray="6 5"/><polygon points="920,630 910,625 910,635" fill="#526bb0"/><text x="790" y="590" text-anchor="middle" font-size="15"><tspan x="790" dy="0">6. 返回事件、Header 与版本</tspan></text><polyline points="920,718 400,718" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="400,718 410,723 410,713" fill="#526bb0"/><text x="660" y="678" text-anchor="middle" font-size="15"><tspan x="660" dy="0">7. 写入压缩归档段和校验信息</tspan></text><polyline points="400,806 920,806" fill="none" stroke="#526bb0" stroke-width="2" stroke-dasharray="6 5"/><polygon points="920,806 910,801 910,811" fill="#526bb0"/><text x="660" y="766" text-anchor="middle" font-size="15"><tspan x="660" dy="0">8. 确认归档对象已保存</tspan></text><polyline points="920,894 835,894 835,918 920,918" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="920,918 910,913 910,923" fill="#526bb0"/><text x="840" y="856" text-anchor="middle" font-size="15"><tspan x="840" dy="0">9. 验证完整性与恢复能力</tspan></text><polyline points="920,982 660,982" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="660,982 670,987 670,977" fill="#526bb0"/><text x="790" y="942" text-anchor="middle" font-size="15"><tspan x="790" dy="0">10. 发布归档索引和已验证水位</tspan></text><polyline points="920,1070 835,1070 835,1094 920,1094" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="920,1094 910,1089 910,1099" fill="#526bb0"/><text x="840" y="1032" text-anchor="middle" font-size="15"><tspan x="840" dy="0">11. 按策略清理可淘汰热副本</tspan></text><rect x="30" y="1134" width="1000" height="54" rx="9" fill="#fff6e5" stroke="#dcc394"/><text x="530" y="1166" text-anchor="middle" font-size="15"><tspan x="530" dy="0">对象与数据库没有天然跨系统事务；失败补偿与引用保留另见正文。</tspan></text></g></svg>
