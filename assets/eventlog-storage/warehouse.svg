<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1120" viewBox="0 0 1060 1120" role="img" aria-labelledby="title"><title id="title">建议方案：数据库先提交，数仓异步接收</title><rect width="1060" height="1120" fill="#fbfcfe"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#172033"><text x="530" y="35" text-anchor="middle" font-size="21"><tspan x="530" dy="0">建议方案：数据库先提交，数仓异步接收</tspan></text><line x1="140" y1="123" x2="140" y2="1025" stroke="#b7c3d6" stroke-dasharray="6 5"/><rect x="30" y="70" width="220" height="53" rx="9" fill="#edf2ff" stroke="#9baedc"/><text x="140" y="102" text-anchor="middle" font-size="17"><tspan x="140" dy="0">业务写入方</tspan></text><line x1="400" y1="123" x2="400" y2="1025" stroke="#b7c3d6" stroke-dasharray="6 5"/><rect x="290" y="70" width="220" height="53" rx="9" fill="#edf2ff" stroke="#9baedc"/><text x="400" y="102" text-anchor="middle" font-size="17"><tspan x="400" dy="0">业务数据库</tspan></text><line x1="660" y1="123" x2="660" y2="1025" stroke="#b7c3d6" stroke-dasharray="6 5"/><rect x="550" y="70" width="220" height="53" rx="9" fill="#edf2ff" stroke="#9baedc"/><text x="660" y="102" text-anchor="middle" font-size="17"><tspan x="660" dy="0">Outbox 导出器</tspan></text><line x1="920" y1="123" x2="920" y2="1025" stroke="#b7c3d6" stroke-dasharray="6 5"/><rect x="810" y="70" width="220" height="53" rx="9" fill="#edf2ff" stroke="#9baedc"/><text x="920" y="102" text-anchor="middle" font-size="17"><tspan x="920" dy="0">分析库 / 数仓</tspan></text><polyline points="140,190 400,190" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="400,190 390,185 390,195" fill="#526bb0"/><text x="270" y="150" text-anchor="middle" font-size="15"><tspan x="270" dy="0">1. 同一事务写事件与待发送记录</tspan></text><polyline points="400,278 140,278" fill="none" stroke="#526bb0" stroke-width="2" stroke-dasharray="6 5"/><polygon points="140,278 150,283 150,273" fill="#526bb0"/><text x="270" y="238" text-anchor="middle" font-size="15"><tspan x="270" dy="0">2. 事务提交成功</tspan></text><polyline points="140,366 225,366 225,390 140,390" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="140,390 150,395 150,385" fill="#526bb0"/><text x="220" y="328" text-anchor="middle" font-size="15"><tspan x="220" dy="0">3. 继续产品流程，不等待数仓</tspan></text><polyline points="660,454 400,454" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="400,454 410,459 410,449" fill="#526bb0"/><text x="530" y="414" text-anchor="middle" font-size="15"><tspan x="530" dy="0">4. 领取已提交的待发送批次</tspan></text><polyline points="400,542 660,542" fill="none" stroke="#526bb0" stroke-width="2" stroke-dasharray="6 5"/><polygon points="660,542 650,537 650,547" fill="#526bb0"/><text x="530" y="502" text-anchor="middle" font-size="15"><tspan x="530" dy="0">5. 返回稳定事件身份与内容</tspan></text><polyline points="660,630 920,630" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="920,630 910,625 910,635" fill="#526bb0"/><text x="790" y="590" text-anchor="middle" font-size="15"><tspan x="790" dy="0">6. 按事件身份幂等写入原始层</tspan></text><polyline points="920,718 660,718" fill="none" stroke="#526bb0" stroke-width="2" stroke-dasharray="6 5"/><polygon points="660,718 670,723 670,713" fill="#526bb0"/><text x="790" y="678" text-anchor="middle" font-size="15"><tspan x="790" dy="0">7. 确认该批次已可靠接收</tspan></text><polyline points="660,806 400,806" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="400,806 410,811 410,801" fill="#526bb0"/><text x="530" y="766" text-anchor="middle" font-size="15"><tspan x="530" dy="0">8. 记录交付确认与消费进度</tspan></text><polyline points="920,894 835,894 835,918 920,918" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="920,918 910,913 910,923" fill="#526bb0"/><text x="840" y="856" text-anchor="middle" font-size="15"><tspan x="840" dy="0">9. 去重、配对，生成调用明细</tspan></text><polyline points="920,982 835,982 835,1006 920,1006" fill="none" stroke="#526bb0" stroke-width="2"/><polygon points="920,1006 910,1001 910,1011" fill="#526bb0"/><text x="840" y="944" text-anchor="middle" font-size="15"><tspan x="840" dy="0">10. 按版本更新日报与分析结果</tspan></text><rect x="30" y="1046" width="1000" height="54" rx="9" fill="#fff6e5" stroke="#dcc394"/><text x="530" y="1078" text-anchor="middle" font-size="15"><tspan x="530" dy="0">写入成功但确认丢失时会重投；进度记录与下游幂等处理必须配合。</tspan></text></g></svg>
