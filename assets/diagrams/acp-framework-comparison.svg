<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 690" role="img" aria-labelledby="title desc">
<title id="title">DeepSeek Harness 与 OpenHands 的 ACP 输出边界</title>
<desc id="desc">DeepSeek Harness 从已提交助手消息选择文本和图片，原始分片留在事件日志；OpenHands CLI 把事件映射为展示更新，还可通过 token 回调发送实时分片。核心恢复和 ACP 历史加载分别比较。</desc>
<defs><marker id="end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657799"/></marker></defs>
<rect width="1040" height="690" rx="16" fill="#fbfcfe"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle" fill="#172033">
<rect x="20" y="20" width="1000" height="300" rx="14" fill="#edf2ff" stroke="#c6d2eb"/>
<rect x="20" y="340" width="1000" height="330" rx="14" fill="#eef7f2" stroke="#b9d8c7"/>
<text x="520" y="58" font-size="22" font-weight="700">DeepSeek Harness · 只发送已提交的助手文本 / 图片</text>
<text x="520" y="378" font-size="22" font-weight="700">OpenHands CLI · 展示事件投影 + 可选实时 token 路径</text>
<g fill="none" stroke="#657799" stroke-width="2" marker-end="url(#end)">
<path d="M225 133H270"/><path d="M495 133H540"/><path d="M765 133H810"/>
<path d="M382 171V202" stroke-dasharray="5 5"/>
<path d="M285 450H380"/><path d="M660 450H755"/>
<path d="M285 555H380"/><path d="M660 555H870V486"/>
</g>
<g fill="white" stroke="#aebed8" stroke-width="1.5">
<rect x="40" y="95" width="185" height="76" rx="10"/>
<rect x="270" y="95" width="225" height="76" rx="10"/>
<rect x="540" y="95" width="225" height="76" rx="10"/>
<rect x="810" y="95" width="190" height="76" rx="10"/>
<rect x="270" y="202" width="495" height="52" rx="10"/>
<rect x="40" y="414" width="245" height="72" rx="10"/>
<rect x="380" y="414" width="280" height="72" rx="10"/>
<rect x="755" y="414" width="245" height="72" rx="10"/>
<rect x="40" y="519" width="245" height="72" rx="10"/>
<rect x="380" y="519" width="280" height="72" rx="10"/>
</g>
<g font-size="17">
<text x="132" y="128">LLM 原始分片</text><text x="132" y="151" font-size="13">尝试 / 重试 / 完整输出</text>
<text x="382" y="128">Session Event Log</text><text x="382" y="151" font-size="13">chunks 与完整 message 均可记录</text>
<text x="652" y="128">选择 assistant/message</text><text x="652" y="151" font-size="13">逐块读取非空 text / image</text>
<text x="905" y="127">ACP 正文更新</text><text x="905" y="151" font-size="12">agent_message_chunk</text>
<text x="517" y="234" font-size="15">chunks、思考、工具、计划留在日志，不作为 ACP 展示更新</text>
<text x="520" y="291" font-size="16" fill="#465e93">核心支持 agents.resume()；当前 ACP 适配器没有 session/load</text>
<text x="162" y="445">Conversation Events</text><text x="162" y="468" font-size="13">实时回调 / 已保存历史</text>
<text x="520" y="444">EventSubscriber</text><text x="520" y="468" font-size="13">SharedEventHandler 格式化与分派</text>
<text x="877" y="444">ACP 展示更新</text><text x="877" y="468" font-size="13">正文 / 思考 / 工具 / 计划</text>
<text x="162" y="550">LLM token callbacks</text><text x="162" y="574" font-size="13">开启 streaming 且路径适用时</text>
<text x="520" y="550">TokenBasedEventSubscriber</text><text x="520" y="574" font-size="13">实时增量与工具调用归并</text>
<text x="520" y="636" font-size="16" fill="#466c56">session/load → state.events → 重新投影；不重放原 token 时序</text>
</g></g></svg>
