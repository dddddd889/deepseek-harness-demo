<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="735" viewBox="0 0 1080 735" role="img" aria-labelledby="title"><title id="title">智能体循环 · 调用时序</title><rect width="1080" height="735" fill="#fbfcfe"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="540" y="32" text-anchor="middle" fill="#172033" font-size="21"><tspan x="540" dy="0">智能体循环 · 调用时序</tspan></text><line x1="145" y1="145" x2="145" y2="700" stroke="#aebad2" stroke-dasharray="6 5"/><rect x="30" y="65" width="230" height="78" rx="12" fill="#edf2ff" stroke="#9baedc"/><text x="145" y="110" text-anchor="middle" fill="#172033" font-size="16"><tspan x="145" dy="0">调用方</tspan></text><line x1="405" y1="145" x2="405" y2="700" stroke="#aebad2" stroke-dasharray="6 5"/><rect x="290" y="65" width="230" height="78" rx="12" fill="#edf2ff" stroke="#9baedc"/><text x="405" y="110" text-anchor="middle" fill="#172033" font-size="16"><tspan x="405" dy="0">Agent</tspan></text><line x1="665" y1="145" x2="665" y2="700" stroke="#aebad2" stroke-dasharray="6 5"/><rect x="550" y="65" width="230" height="78" rx="12" fill="#edf2ff" stroke="#9baedc"/><text x="665" y="110" text-anchor="middle" fill="#172033" font-size="16"><tspan x="665" dy="0">模型步骤</tspan></text><line x1="925" y1="145" x2="925" y2="700" stroke="#aebad2" stroke-dasharray="6 5"/><rect x="810" y="65" width="230" height="78" rx="12" fill="#edf2ff" stroke="#9baedc"/><text x="925" y="110" text-anchor="middle" fill="#172033" font-size="16"><tspan x="925" dy="0">Session</tspan></text><polyline points="145,205 405,205" fill="none" stroke="#526bb0" stroke-width="2" /><polygon points="405,205 394,200 394,210" fill="#526bb0"/><text x="275" y="173" text-anchor="middle" fill="#354d83" font-size="14"><tspan x="275" dy="0">1. send 用户消息</tspan></text><polyline points="145,295 405,295" fill="none" stroke="#526bb0" stroke-width="2" /><polygon points="405,295 394,290 394,300" fill="#526bb0"/><text x="275" y="263" text-anchor="middle" fill="#354d83" font-size="14"><tspan x="275" dy="0">2. run 认领输入</tspan></text><polyline points="405,385 925,385" fill="none" stroke="#526bb0" stroke-width="2" /><polygon points="925,385 914,380 914,390" fill="#526bb0"/><text x="665" y="353" text-anchor="middle" fill="#354d83" font-size="14"><tspan x="665" dy="0">3. 轮次与步骤开始</tspan></text><polyline points="405,475 665,475" fill="none" stroke="#526bb0" stroke-width="2" /><polygon points="665,475 654,470 654,480" fill="#526bb0"/><text x="535" y="443" text-anchor="middle" fill="#354d83" font-size="14"><tspan x="535" dy="0">4. 执行模型步骤</tspan></text><polyline points="665,565 405,565" fill="none" stroke="#8b5f20" stroke-width="2" stroke-dasharray="7 5"/><polygon points="405,565 416,570 416,560" fill="#8b5f20"/><text x="535" y="533" text-anchor="middle" fill="#354d83" font-size="14"><tspan x="535" dy="0">5. 返回完成或工具请求</tspan></text><polyline points="405,655 925,655" fill="none" stroke="#526bb0" stroke-width="2" /><polygon points="925,655 914,650 914,660" fill="#526bb0"/><text x="665" y="623" text-anchor="middle" fill="#354d83" font-size="14"><tspan x="665" dy="0">6. 步骤与轮次结束</tspan></text></g></svg>
