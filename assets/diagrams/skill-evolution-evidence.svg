<title id="title">Skill 经验改进与运行证据的三条路径</title>
<desc id="desc">OpenHands 通过公开指令从评审评论提炼 Skill 并提出草稿 PR。Harness 专项维护方案核实采纳并保存源 blob，工具私有且 Note 仍 proposed。进一步建议绑定加载版本、执行结果和固定任务集对比，再采用或回滚。</desc>
