<text x="149" y="119">历史 PR 评审评论</text><text x="407" y="107">过滤噪声</text><text x="407" y="131" font-size="14">提炼重复反馈模式</text><text x="665" y="107">Skill / 指引候选</text><text x="665" y="131" font-size="14">写成文件</text><text x="938" y="119">Draft PR · 人工评审</text>
<text x="149" y="285">人工反馈 + commit</text><text x="149" y="309" font-size="14">合并前的证据锚点</text><text x="407" y="285">核实采纳</text><text x="407" y="309" font-size="14">两个独立评审适配器</text><text x="665" y="285">候选 diff + 源 blob</text><text x="665" y="309" font-size="14">保存反馈与检查结果</text><text x="938" y="285">维护者决定 · PR 推广</text><text x="938" y="309" font-size="14">源 Skill 漂移则停止</text>
