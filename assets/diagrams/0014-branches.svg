<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img" aria-labelledby="title"><title id="title">无界面宿主 · 异常与边界分支</title><rect width="1040" height="650" fill="#fbfcfe"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="520" y="32" text-anchor="middle" fill="#172033" font-size="21"><tspan x="520" dy="0">无界面宿主 · 异常与边界分支</tspan></text><path d="M 150 220 L 250 320 L 150 420 L 50 320 Z" fill="#fff3db" stroke="#b89049"/><text x="150" y="308" text-anchor="middle" fill="#172033" font-size="16"><tspan x="150" dy="0">观察到哪种情况</tspan><tspan x="150" dy="22">？</tspan></text><polyline points="250,320 280,320 280,134 340,134" fill="none" stroke="#526bb0" stroke-width="2" /><polygon points="340,134 329,129 329,139" fill="#526bb0"/><polyline points="600,134 690,134" fill="none" stroke="#526bb0" stroke-width="2" /><polygon points="690,134 679,129 679,139" fill="#526bb0"/><rect x="340" y="95" width="260" height="78" rx="12" fill="#fff7e8" stroke="#9baedc"/><text x="470" y="140" text-anchor="middle" fill="#172033" font-size="16"><tspan x="470" dy="0">未知配置字段</tspan></text><rect x="690" y="95" width="300" height="78" rx="12" fill="#eaf5ef" stroke="#9baedc"/><text x="840" y="140" text-anchor="middle" fill="#172033" font-size="16"><tspan x="840" dy="0">装配前拒绝</tspan></text><polyline points="250,320 280,320 280,264 340,264" fill="none" stroke="#526bb0" stroke-width="2" /><polygon points="340,264 329,259 329,269" fill="#526bb0"/><polyline points="600,264 690,264" fill="none" stroke="#526bb0" stroke-width="2" /><polygon points="690,264 679,259 679,269" fill="#526bb0"/><rect x="340" y="225" width="260" height="78" rx="12" fill="#fff7e8" stroke="#9baedc"/><text x="470" y="270" text-anchor="middle" fill="#172033" font-size="16"><tspan x="470" dy="0">插件包启动失败</tspan></text><rect x="690" y="225" width="300" height="78" rx="12" fill="#eaf5ef" stroke="#9baedc"/><text x="840" y="270" text-anchor="middle" fill="#172033" font-size="16"><tspan x="840" dy="0">逆序回滚</tspan></text><polyline points="250,320 280,320 280,394 340,394" fill="none" stroke="#526bb0" stroke-width="2" /><polygon points="340,394 329,389 329,399" fill="#526bb0"/><polyline points="600,394 690,394" fill="none" stroke="#526bb0" stroke-width="2" /><polygon points="690,394 679,389 679,399" fill="#526bb0"/><rect x="340" y="355" width="260" height="78" rx="12" fill="#fff7e8" stroke="#9baedc"/><text x="470" y="400" text-anchor="middle" fill="#172033" font-size="16"><tspan x="470" dy="0">会话标识已存在</tspan></text><rect x="690" y="355" width="300" height="78" rx="12" fill="#eaf5ef" stroke="#9baedc"/><text x="840" y="400" text-anchor="middle" fill="#172033" font-size="16"><tspan x="840" dy="0">拒绝覆盖</tspan></text><polyline points="250,320 280,320 280,524 340,524" fill="none" stroke="#526bb0" stroke-width="2" /><polygon points="340,524 329,519 329,529" fill="#526bb0"/><polyline points="600,524 690,524" fill="none" stroke="#526bb0" stroke-width="2" /><polygon points="690,524 679,519 679,529" fill="#526bb0"/><rect x="340" y="485" width="260" height="78" rx="12" fill="#fff7e8" stroke="#9baedc"/><text x="470" y="530" text-anchor="middle" fill="#172033" font-size="16"><tspan x="470" dy="0">输入中断或退出</tspan></text><rect x="690" y="485" width="300" height="78" rx="12" fill="#eaf5ef" stroke="#9baedc"/><text x="840" y="530" text-anchor="middle" fill="#172033" font-size="16"><tspan x="840" dy="0">取消并释放资源</tspan></text><text x="520" y="625" text-anchor="middle" fill="#667085" font-size="14"><tspan x="520" dy="0">分支按触发条件分类；不同阶段可能先后触发，不表示一次只会出现一种故障。</tspan></text></g></svg>
