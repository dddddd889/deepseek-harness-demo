<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 670" role="img" aria-labelledby="title desc">
<title id="title">建议改造：ACP 投影器与 session/load 状态机</title>
<desc id="desc">此图是尚未实现的建议方案。现有事件与恢复能力分别进入纯投影器和加载状态机。原自动化入口保留；交互入口需要有序队列和历史实时交接。</desc>
<defs><marker id="end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#657799"/></marker></defs>
<rect width="1040" height="670" rx="15" fill="#fbfcfe"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle" fill="#172033">
<text x="520" y="38" font-size="23" font-weight="700">建议方案 · 复用事件事实，补齐投影与连接状态机</text>
<g stroke="#657799" stroke-width="2" fill="none" marker-end="url(#end)">
<path d="M270 130H370"/><path d="M670 130H770"/>
<path d="M160 168V214H470"/>
<path d="M290 322H380"/><path d="M660 322H750"/>
<path d="M880 360V410H160V450"/>
<path d="M290 488H380"/><path d="M660 488H750"/>
<path d="M880 526V575H520V601"/>
</g>
<g fill="white" stroke="#aebed8" stroke-width="1.5">
<rect x="45" y="92" width="225" height="76" rx="10"/>
<rect x="370" y="92" width="300" height="76" rx="10" fill="#edf2ff"/>
<rect x="770" y="92" width="225" height="76" rx="10" fill="#edf2ff"/>
<rect x="470" y="190" width="475" height="48" rx="9" fill="#eef7f2"/>
<rect x="30" y="284" width="260" height="76" rx="10"/>
<rect x="380" y="284" width="280" height="76" rx="10" fill="#fff3db"/>
<rect x="750" y="284" width="260" height="76" rx="10" fill="#fff3db"/>
<rect x="30" y="450" width="260" height="76" rx="10" fill="#edf2ff"/>
<rect x="380" y="450" width="280" height="76" rx="10" fill="#edf2ff"/>
<rect x="750" y="450" width="260" height="76" rx="10" fill="#eef7f2"/>
</g>
<g font-size="18">
<text x="158" y="121">现有 SessionEvent</text><text x="158" y="147" font-size="14">chunks / messages / 边界 / 来源</text>
<text x="520" y="121" font-weight="700">新增纯投影器</text><text x="520" y="147" font-size="14">live 增量 · replay 历史 · hydrate 状态</text>
<text x="882" y="121">交互 ACP 输出队列</text><text x="882" y="147" font-size="14">有序、有界、可取消</text>
<text x="707" y="220" font-size="15">原自动化 ACP 保留已提交输出；新入口按明确语义启用流式</text>
<text x="160" y="314">session/load</text><text x="160" y="340" font-size="14">输入校验与访问授权</text>
<text x="520" y="314">复用 agents.resume</text><text x="520" y="340" font-size="14">持久化准备、修复、正确装配</text>
<text x="880" y="314">建立连接所有权</text><text x="880" y="340" font-size="14">捕获实时尾部；必要时阻止自动运行</text>
<text x="520" y="400" font-size="14" fill="#667085">在事件被捕获的条件下确定切面 S；历史与实时使用同一条有序发送链</text>
<text x="160" y="480">重放历史 ≤ S</text><text x="160" y="506" font-size="14">用户与助手消息；不盲播旧 chunks</text>
<text x="520" y="480">释放实时尾部 &gt; S</text><text x="520" y="506" font-size="14">按 seq 排序去重，防止交接窗口漏发</text>
<text x="880" y="480">进入 live</text><text x="880" y="506" font-size="14">历史输出完成，再结束 load 请求</text>
<text x="520" y="628" font-size="17" font-weight="700">这不是当前实现；需用协议、并发、冷恢复与互操作测试验收</text>
</g></g></svg>
