<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img" aria-labelledby="title desc"><title id="title">自己要实现的 Electron 领域边界</title><desc id="desc">Renderer 和 Web 共用 UI 与投影；桌面通过 preload、main 的窄接口代理同一 Host，主进程另管子进程生命周期。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#667085"/></marker></defs><rect width="1080" height="590" fill="#fbfcfe"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#172033">
<rect x="30" y="35" width="290" height="110" rx="10" fill="#eaf5ef" stroke="#90b69e"/><text x="175.0" y="64" text-anchor="middle">Renderer · 用户界面</text><text x="175.0" y="96" font-size="15" text-anchor="middle">共用 Web 组件与 UI 投影</text><text x="175.0" y="123" font-size="15" text-anchor="middle">自己的 DesktopClient 适配器</text>
<rect x="390" y="35" width="290" height="110" rx="10" fill="#eaf5ef" stroke="#90b69e"/><text x="535.0" y="64" text-anchor="middle">Preload · 能力桥</text><text x="535.0" y="96" font-size="15" text-anchor="middle">contextBridge 按用途暴露方法</text><text x="535.0" y="123" font-size="15" text-anchor="middle">订阅返回撤销函数</text>
<rect x="750" y="35" width="300" height="110" rx="10" fill="#eaf5ef" stroke="#90b69e"/><text x="900.0" y="64" text-anchor="middle">Main · 桌面主进程</text><text x="900.0" y="96" font-size="15" text-anchor="middle">校验 sender、参数与所有权</text><text x="900.0" y="123" font-size="15" text-anchor="middle">持有本地连接凭证与系统能力</text>
<rect x="750" y="260" width="300" height="110" rx="10" fill="#eaf5ef" stroke="#90b69e"/><text x="900.0" y="289" text-anchor="middle">Host · 自己的 Agent 服务</text><text x="900.0" y="321" font-size="15" text-anchor="middle">复用 25～27 的业务与传输</text><text x="900.0" y="348" font-size="15" text-anchor="middle">Session / 审批 / 输入接收</text>
<rect x="390" y="260" width="290" height="110" rx="10" fill="#eaf5ef" stroke="#90b69e"/><text x="535.0" y="289" text-anchor="middle">Agent Loop · 共用执行</text><text x="535.0" y="321" font-size="15" text-anchor="middle">工具管线 / 取消 / 事件事实</text><text x="535.0" y="348" font-size="15" text-anchor="middle">桌面主进程不重新实现循环</text>
<rect x="30" y="260" width="290" height="110" rx="10" fill="#eaf5ef" stroke="#90b69e"/><text x="175.0" y="289" text-anchor="middle">模型提供方</text><text x="175.0" y="321" font-size="15" text-anchor="middle">固定模型 → DeepSeek / pi-ai</text><text x="175.0" y="348" font-size="15" text-anchor="middle">统一流事件与请求取消</text>
<g stroke="#667085" fill="none" marker-end="url(#arrow)"><path d="M320 72H385"/><path d="M390 112H325"/><path d="M680 72H745"/><path d="M750 112H685"/><path d="M860 145V255"/><path d="M950 260V150"/><path d="M750 297H685"/><path d="M680 337H745"/><path d="M390 297H325"/><path d="M320 337H385"/></g>
<text x="900" y="188" text-anchor="middle" font-size="15">RPC / SSE 代理</text><path d="M1030 145V255" stroke="#667085" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/><text x="1020" y="227" text-anchor="end" font-size="14">ready / shutdown</text>
<text x="540" y="433" text-anchor="middle">请求向模型方向传播；流事件与结果反向返回。</text><text x="540" y="467" text-anchor="middle">取消与审批沿同一业务入口结算；窗口关闭与应用退出由生命周期策略处理。</text><text x="540" y="520" text-anchor="middle" font-size="16">这是从零课程选择的实现方案；原版 desktop / desktop-host 的传输与装配需按源码分别对照。</text></g></svg>