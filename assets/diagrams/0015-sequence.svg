<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="825" viewBox="0 0 1080 825" role="img" aria-labelledby="title"><title id="title">智能体服务 · 调用时序</title><rect width="1080" height="825" fill="#fbfcfe"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="540" y="32" text-anchor="middle" fill="#172033" font-size="21"><tspan x="540" dy="0">智能体服务 · 调用时序</tspan></text><line x1="145" y1="145" x2="145" y2="790" stroke="#aebad2" stroke-dasharray="6 5"/><rect x="30" y="65" width="230" height="78" rx="12" fill="#edf2ff" stroke="#9baedc"/><text x="145" y="110" text-anchor="middle" fill="#172033" font-size="16"><tspan x="145" dy="0">客户端</tspan></text><line x1="405" y1="145" x2="405" y2="790" stroke="#aebad2" stroke-dasharray="6 5"/><rect x="290" y="65" width="230" height="78" rx="12" fill="#edf2ff" stroke="#9baedc"/><text x="405" y="110" text-anchor="middle" fill="#172033" font-size="16"><tspan x="405" dy="0">AgentServer</tspan></text><line x1="665" y1="145" x2="665" y2="790" stroke="#aebad2" stroke-dasharray="6 5"/><rect x="550" y="65" width="230" height="78" rx="12" fill="#edf2ff" stroke="#9baedc"/><text x="665" y="110" text-anchor="middle" fill="#172033" font-size="16"><tspan x="665" dy="0">会话宿主</tspan></text><line x1="925" y1="145" x2="925" y2="790" stroke="#aebad2" stroke-dasharray="6 5"/><rect x="810" y="65" width="230" height="78" rx="12" fill="#edf2ff" stroke="#9baedc"/><text x="925" y="110" text-anchor="middle" fill="#172033" font-size="16"><tspan x="925" dy="0">Session</tspan></text><polyline points="145,205 405,205" fill="none" stroke="#526bb0" stroke-width="2" /><polygon points="405,205 394,200 394,210" fill="#526bb0"/><text x="275" y="173" text-anchor="middle" fill="#354d83" font-size="14"><tspan x="275" dy="0">1. Bearer 与 session.send</tspan></text><polyline points="405,295 480,295 480,323 405,323" fill="none" stroke="#526bb0" stroke-width="2" /><polygon points="405,323 416,328 416,318" fill="#526bb0"/><text x="483" y="280" text-anchor="middle