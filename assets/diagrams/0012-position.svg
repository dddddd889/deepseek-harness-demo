<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1340" viewBox="0 0 1200 1340" role="img" aria-labelledby="title"><title id="title">第 12 课 · 外部能力与知识的系统位置</title><rect width="1200" height="1340" fill="#fbfcfe"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="600" y="35" text-anchor="middle" font-size="23" fill="#172033">第 12 课 · 外部能力与知识的系统位置</text><text x="600" y="78" text-anchor="middle" font-size="16" fill="#667085">横切底座：第 1～3 课支撑全系统，不是按顺序执行的三个步骤</text><rect x="35" y="95" width="1110" height="108" rx="12" fill="#f2f4f7"/><polyline points="590,348 590,420" fill="none" stroke="#98a2b3" stroke-width="2"/><polygon points="590,420 595,410 585,410" fill="#98a2b3"/><polyline points="590,498 590,570" fill="none" stroke="#98a2b3" stroke-width="2"/><polygon points="590,570 595,560 585,560" fill="#98a2b3"/><polyline points="310,459 365,459 365,580 460,580" fill="none" stroke="#98a2b3" stroke-width="2"/><polygon points="460,580 450,575 450,585" fill="#98a2b3"/><polyline points="310,615 460,615" fill="none" stroke="#98a2b3" stroke-width="2"/><polygon points="460,615 450,610 450,620" fill="#98a2b3"/><polyline points="720,609 870,609" fill="none" stroke="#98a2b3" stroke-width="2"/><polygon points="870,609 860,604 860,614" fill="#98a2b3"/><polyline points="460,640 430,640 430,690 180,690 180,720" fill="none" stroke="#98a2b3" stroke-width="2"/><polygon points="180,720 185,710 175,710" fill="#98a2b3"/><polyline points="180,798 180,1030" fill="none" stroke="#98a2b3" stroke-width="2"/><polygon points="180,1030 185,1020 175,1020" fill="#98a2b3"/><polyline points="310,759 870,759" fill="none" stroke="#98a2b3" stroke-width="2"/><polygon points="870,759 860,754 860,764" fill="#98a2b3"/><polyline points="1000,720 1000,648" fill="none" stroke="#98a2b3" stroke-width="2"/><polygon points="1000,648 995,658 1005,658" fill="#98a2b3"/><polyline points="590,648 590,900" fill="none" stroke="#98a2b3" stroke-width="2"/><polygon points="590,900 595,890 585,890" fill="#98a2b3"/><polyline points="870,939 720,939" fill="none" stroke="#98a2b3" stroke-width="2"/><polygon points="720,939 730,944 730,934" fill="#98a2b3"/><polyline points="590,978 590,1180" fill="none" stroke="#98a2b3" stroke-width="2"/><polygon points="590,1180 595,1170 585,1170" fill="#98a2b3"/><polyline points="720,960 820,960 820,1075 1000,1075 1000,1180" fill="none" stroke="#98a2b3" stroke-width="2"/><polygon points="1000,1180 1005,1170 995,1170" fill="#98a2b3"/><polyline points="50,759 25,759 25,1219 50,1219" fill="none" stroke="#98a2b3" stroke-width="2"/><polygon points="50,1219 40,1214 40,1224" fill="#98a2b3"/><rect x="607" y="372" width="106" height="24" rx="4" fill="#fbfcfe"/><text x="660" y="390" text-anchor="middle" font-size="15" fill="#344054">远程交互</text><rect x="607" y="522" width="106" height="24" rx="4" fill="#fbfcfe"/><text x="660" y="540" text-anchor="middle" font-size="15" fill="#344054">会话操作</text><rect x="307" y="512" width="106" height="24" rx="4" fill="#fbfcfe"/><text x="360" y="530" text-anchor="middle" font-size="15" fill="#344054">装配运行时</text><rect x="327" y="627" width="106" height="24" rx="4" fill="#fbfcfe"/><text x="380" y="645" text-anchor="middle" font-size="15" fill="#344054">创建或委派</text><rect x="742" y="577" width="106" height="24" rx="4" fill="#fbfcfe"/><text x="795" y="595" text-anchor="middle" font-size="15" fill="#344054">模型调用</text><rect x="232" y="662" width="106" height="24" rx="4" fill="#fbfcfe"/><text x="285" y="680" text-anchor="middle" font-size="15" fill="#344054">记录事实</text><rect x="202" y="932" width="106" height="24" rx="4" fill="#fbfcfe"/><text x="255" y="950" text-anchor="middle" font-size="15" fill="#344054">保存与加载</text><rect x="537" y="727" width="106" height="24" rx="4" fill="#fbfcfe"/><text x="590" y="745" text-anchor="middle" font-size="15" fill="#344054">提供历史</text><rect x="1027" y="672" width="106" height="24" rx="4" fill="#fbfcfe"/><text x="1080" y="690" text-anchor="middle" font-size="15" fill="#344054">准备上下文</text><rect x="622" y="827" width="106" height="24" rx="4" fill="#fbfcfe"/><text x="675" y="845" text-anchor="middle" font-size="15" fill="#344054">调度行动</text><rect x="742" y="907" width="106" height="24" rx="4" fill="#fbfcfe"/><text x="795" y="925" text-anchor="middle" font-size="15" fill="#344054">约束执行</text><rect x="607" y="1082" width="106" height="24" rx="4" fill="#fbfcfe"/><text x="660" y="1100" text-anchor="middle" font-size="15" fill="#344054">本地操作</text><rect x="947" y="1087" width="106" height="24" rx="4" fill="#fbfcfe"/><text x="1000" y="1105" text-anchor="middle" font-size="15" fill="#344054">外部调用</text><rect x="52" y="1112" width="106" height="24" rx="4" fill="#fbfcfe"/><text x="105" y="1130" text-anchor="middle" font-size="15" fill="#344054">观测副本</text><rect x="50" y="110" width="260" height="78" rx="12" fill="#f2f4f7" stroke="#c4cbd4" stroke-width="1"/><text x="180" y="139" text-anchor="middle" font-size="18" fill="#475467">第 1 课：</text><text x="180" y="164" text-anchor="middle" font-size="18" fill="#475467">工程基线</text><rect x="460" y="110" width="260" height="78" rx="12" fill="#f2f4f7" stroke="#c4cbd4" stroke-width="1"/><text x="590" y="139" text-anchor="middle" font-size="18" fill="#475467">第 2 课：</text><text x="590" y="164" text-anchor="middle" font-size="18" fill="#475467">插件内核</text><rect x="870" y="110" width="260" height="78" rx="12" fill="#f2f4f7" stroke="#c4cbd4" stroke-width="1"/><text x="1000" y="139" text-anchor="middle" font-size="18" fill="#475467">第 3 课：</text><text x="1000" y="164" text-anchor="middle" font-size="18" fill="#475467">领域协议</text><rect x="50" y="720" width="260" height="78" rx="12" fill="#f2f4f7" stroke="#c4cbd4" stroke-width="1"/><text x="180" y="749" text-anchor="middle" font-size="18" fill="#475467">第 4 课：</text><text x="180" y="774" text-anchor="middle" font-size="18" fill="#475467">会话与投影</text><rect x="870" y="570" width="260" height="78" rx="12" fill="#f2f4f7" stroke="#c4cbd4" stroke-width="1"/><text x="1000" y="599" text-anchor="middle" font-size="18" fill="#475467">第 5 课：</text><text x="1000" y="624" text-anchor="middle" font-size="18" fill="#475467">流式模型接口</text><rect x="460" y="570" width="260" height="78" rx="12" fill="#f2f4f7" stroke="#c4cbd4" stroke-width="1"/><text x="590" y="599" text-anchor="middle" font-size="18" fill="#475467">第 6 课：</text><text x="590" y="624" text-anchor="middle" font-size="18" fill="#475467">智能体循环</text><rect x="460" y="900" width="260" height="78" rx="12" fill="#f2f4f7" stroke="#c4cbd4" stroke-width="1"/><text x="590" y="929" text-anchor="middle" font-size="18" fill="#475467">第 7 课：</text><text x="590" y="954" text-anchor="middle" font-size="18" fill="#475467">工具流水线</text><rect x="460" y="1180" width="260" height="78" rx="12" fill="#f2f4f7" stroke="#c4cbd4" stroke-width="1"/><text x="590" y="1209" text-anchor="middle" font-size="18" fill="#475467">第 8 课：</text><text x="590" y="1234" text-anchor="middle" font-size="18" fill="#475467">本地能力</text><rect x="870" y="900" width="260" height="78" rx="12" fill="#f2f4f7" stroke="#c4cbd4" stroke-width="1"/><text x="1000" y="929" text-anchor="middle" font-size="18" fill="#475467">第 9 课：</text><text x="1000" y="954" text-anchor="middle" font-size="18" fill="#475467">权限与沙箱</text><rect x="50" y="1030" width="260" height="78" rx="12" fill="#f2f4f7" stroke="#c4cbd4" stroke-width="1"/><text x="180" y="1059" text-anchor="middle" font-size="18" fill="#475467">第 10 课：</text><text x="180" y="1084" text-anchor="middle" font-size="18" fill="#475467">持久化与恢复</text><rect x="870" y="720" width="260" height="78" rx="12" fill="#f2f4f7" stroke="#c4cbd4" stroke-width="1"/><text x="1000" y="749" text-anchor="middle" font-size="18" fill="#475467">第 11 课：</text><text x="1000" y="774" text-anchor="middle" font-size="18" fill="#475467">上下文压缩与外置</text><rect x="870" y="1180" width="260" height="78" rx="12" fill="#fff0c2" stroke="#b46b00" stroke-width="3"/><text x="1000" y="1209" text-anchor="middle" font-size="18" fill="#784000">第 12 课：</text><text x="1000" y="1234" text-anchor="middle" font-size="18" fill="#784000">外部能力与知识</text><rect x="50" y="570" width="260" height="78" rx="12" fill="#f2f4f7" stroke="#c4cbd4" stroke-width="1"/><text x="180" y="599" text-anchor="middle" font-size="18" fill="#475467">第 13 课：</text><text x="180" y="624" text-anchor="middle" font-size="18" fill="#475467">任务与子智能体编排</text><rect x="50" y="420" width="260" height="78" rx="12" fill="#f2f4f7" stroke="#c4cbd4" stroke-width="1"/><text x="180" y="449" text-anchor="middle" font-size="18" fill="#475467">第 14 课：</text><text x="180" y="474" text-anchor="middle" font-size="18" fill="#475467">配置、组合与无界面入口</text><rect x="460" y="420" width="260" height="78" rx="12" fill="#f2f4f7" stroke="#c4cbd4" stroke-width="1"/><text x="590" y="449" text-anchor="middle" font-size="18" fill="#475467">第 15 课：</text><text x="590" y="474" text-anchor="middle" font-size="18" fill="#475467">智能体服务层</text><rect x="460" y="270" width="260" height="78" rx="12" fill="#f2f4f7" stroke="#c4cbd4" stroke-width="1"/><text x="590" y="299" text-anchor="middle" font-size="18" fill="#475467">第 16 课：</text><text x="590" y="324" text-anchor="middle" font-size="18" fill="#475467">网页与产品闭环</text><rect x="50" y="1180" width="260" height="78" rx="12" fill="#f2f4f7" stroke="#c4cbd4" stroke-width="1"/><text x="180" y="1209" text-anchor="middle" font-size="18" fill="#475467">第 17 课：</text><text x="180" y="1234" text-anchor="middle" font-size="18" fill="#475467">观测、成本与发布加固</text><text x="600" y="1300" text-anchor="middle" font-size="15" fill="#667085">橙色：本课职责；灰色：系统其余部分。箭头为选取的关系，交叉处不表示连接。</text></g></svg>
